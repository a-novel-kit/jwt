name: main

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"

jobs:
  test-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.test.outputs.artifact-id }}
    steps:
      - uses: a-novel-kit/workflows/go-actions/test-go@v1.67.0
        id: test
        with:
          modfile: gotestsum.mod

  lint-hash-registration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every package naming a crypto.Hash imports its registrar
        shell: bash
        run: bash .github/scripts/lint-hash-registration.sh .

  lint-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/go-actions/lint-go@v1.67.0

  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/lint-node@v1.67.0
        with:
          lint_action: "lint:prettier"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  lint-shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/generic-actions/lint-shell@v1.67.0
        with:
          # renovate: datasource=github-releases depName=koalaman/shellcheck
          version: "0.11.0"

  # A library's conventions sit with golangci-lint, so this job runs no ruleset.
  lint-semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/lint-semgrep@v1.67.0
        with:
          ruleset: none
          # renovate: datasource=docker depName=semgrep/semgrep
          version: "1.182.0"

  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/scan-secrets@v1.67.0
        with:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          version: "8.30.1"

  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.67.0
        with:
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.31.1"

  report-codecov:
    runs-on: ubuntu-latest
    needs: [test-go]
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/codecov@v1.67.0
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
          coverage_files: coverage.txt
          coverage_artifact_ids: ${{ needs.test-go.outputs.artifact-id }}
