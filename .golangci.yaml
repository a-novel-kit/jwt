# golib's .golangci.yaml is the Go-library baseline (happiness-day ruling ci R9). This file is a
# copy of it, and each deviation carries its reason inline.
version: "2"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(go.opentelemetry.io)
        - prefix(github.com/a-novel-kit)
        - localmodule

linters:
  default: none
  enable: # https://golangci-lint.run/docs/configuration/file/
    #    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    #    - cyclop
    - decorder
    #    - depguard
    #    - dogsled
    #    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    #    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    #    - exhaustive
    #    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    #    - funlen
    #    - ginkgolinter
    - gocheckcompilerdirectives
    #    - gochecknoglobals
    #    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    #    - gocyclo
    - godoclint
    - godot
    #    - godox
    - goheader
    - gomoddirectives
    #    - gomodguard
    - goprintffuncname
    - gosec
    #    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    #    - interfacebloat
    - intrange
    - iotamixing
    #    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    #    - mnd
    - musttag
    - nakedret
    - nestif
    #    - nilerr
    - nilnesserr
    #    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    #    - promlinter
    #    - protogetter
    - reassign
    - recvcheck
    #    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    #    - varnamelen
    - wastedassign
    - whitespace
    #    - wrapcheck
    #    - wsl
    - wsl_v5
  #    - zerologlint

  settings:
    tagliatelle:
      case:
        rules:
          # Deviation from golib's goCamel: JOSE fixes its member names in snake_case, such as
          # "key_ops" (RFC 7517 §4.3) and "x5t#S256" (RFC 7515 §4.1.8), so the JSON tags follow them.
          json: goSnake
          yaml: goCamel

  exclusions:
    paths:
      - mocks
      - proto
    rules:
      - path: (.+)_test.go
        linters:
          - forcetypeassert
          - maintidx
          - gocognit
          - tagliatelle
          - goconst
